# Builds one source branch of this repo: `integration` (my build of storytold/lightcraft with my open PRs) or a
# `candidate-<name>` (an integration rebuild to compare against it). Started by `just personal-build` from the lightcraft
# tools (lightcraft-local), which pushes the branch here and dispatches this workflow on `main` with the branch as `ref`.
# Every run belongs to `main`, so all of them share `main`'s caches; only runs of ref `integration` with save-cache (my build) write them.
name: Build
run-name: ${{ inputs.ref }} (${{ inputs.save-cache && 'my build' || 'candidate' }})

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source branch of this repo: integration or candidate-<name>"
        required: true
        type: string
      craft-fonts-ref:
        description: "storytold/craft-fonts commit (the laptop's craft-fonts-current)"
        required: true
        type: string
      rust-toolchain:
        description: "rustc version (the laptop's), e.g. 1.99.1"
        required: true
        type: string
      save-cache:
        description: "Write the dependency caches (my build only; candidates read them)"
        required: false
        type: boolean
        default: false
      linux-ci:
        description: "Also run every cargo xtask ci step on Linux"
        required: false
        type: boolean
        default: true
      cache:
        # Measured 29 Oct at 4f216e6b58 (app job): cold 13.2 min mbx vs 16.8 rust-cache; same commit restored 2.3 vs 7.5;
        # a one-line edit in lightcraft-develop 6.1 vs 6.6. rust-cache stays as a fallback if the mbx Action breaks.
        description: "App job compile cache: mbx (per-compilation objects, our own crates too) or rust-cache (dependencies only)"
        required: false
        type: choice
        options: [mbx, rust-cache]
        default: mbx
      linux-cache:
        description: "Linux jobs' compile cache: mbx (per-compilation objects, our own crates too) or rust-cache (dependencies only)"
        required: false
        type: choice
        options: [mbx, rust-cache]
        default: mbx
      proof-release:
        description: "Publish the kept build (ref integration only) under a throwaway tag build-proof-…, never a real build-* tag (to prove the release job; delete it afterwards)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One run per source branch: a newer dispatch for the same branch replaces its run; branches run side by side.
concurrency:
  group: build-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: LightCraft.app (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      sha: ${{ steps.build.outputs.sha }}
      short: ${{ steps.build.outputs.short }}
      format: ${{ steps.format.outputs.number }}
      licenses: ${{ steps.licenses.outputs.count }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Name the build
        id: build
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          case $REF in integration | candidate-?*) ;; *) echo "::error::ref must be integration or candidate-<name>, not '$REF'"; exit 1 ;; esac
          case $REF in */*) echo "::error::ref '$REF' has a '/'"; exit 1 ;; esac
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:10}" >> "$GITHUB_OUTPUT"
          echo "LIGHTCRAFT_BUILD_SHA=$sha" >> "$GITHUB_ENV"

      # My library is catalog format 11 (the backup chain, #800/#814 and up); main writes 9 and refuses it. A build
      # without format 11 must never reach my library, so fail before building it.
      - name: Require catalog format 11
        id: format
        run: |
          set -euo pipefail
          if ! grep -Eq '^[[:space:]]*format\(11,' crates/catalog/src/journal.rs; then
            echo "::error::crates/catalog/src/journal.rs has no catalog format 11: this build lacks the backup chain (#800/#814) and must not open my library."
            exit 1
          fi
          echo "number=$(grep -Eo '^[[:space:]]*format\([0-9]+,' crates/catalog/src/journal.rs | grep -Eo '[0-9]+' | sort -n | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ inputs.craft-fonts-ref }}
          path: craft-fonts
          persist-credentials: false

      # Does nothing unless the source has craft-i18n.rev (as in storytold's release workflow).
      - name: Check out craft-i18n
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          targets: aarch64-apple-darwin

      # rust-cache keys on the toolchain and Cargo.lock and falls back to the newest entry with the same prefix, so a
      # candidate restores my build's dependencies and rebuilds only what changed. The root Cargo.toml (profiles,
      # workspace dependencies) is not in the key, unlike storytold's gate.yml, so candidates keep that fallback; a change
      # there with an unchanged Cargo.lock rebuilds those dependencies until Cargo.lock next changes (slower, never wrong).
      - if: inputs.cache == 'rust-cache'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          key: app-macos-aarch64
          save-if: ${{ inputs.save-cache && inputs.ref == 'integration' }}
          cache-on-failure: true

      # mbx (mr boxington) keys each compiler call by its inputs, so our own unchanged crates are reused too, not only
      # dependencies. `objects` mode because a fresh checkout's new file times would make Cargo rebuild a restored target/.
      # Objects leave out Cargo's downloads, so those get their own cache.
      - if: inputs.cache == 'mbx'
        id: downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-
      - if: inputs.cache == 'mbx'
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          github-cache-mode: objects
          save-on-workflow-dispatch: ${{ inputs.save-cache && inputs.ref == 'integration' }}
      # package.sh runs plain `cargo build`: put mbx's Cargo shim first on PATH so those builds go through mbx.
      - if: inputs.cache == 'mbx'
        name: Route cargo through mbx
        run: |
          set -euo pipefail
          mbx --version
          mbx setup --status || true
          mbx setup </dev/null
          shim_dir="$HOME/Library/Application Support/mbx/bin"
          [ -x "$shim_dir/cargo" ] || { echo "::error::no Cargo shim at $shim_dir"; exit 1; }
          echo "$shim_dir" >> "$GITHUB_PATH"
          PATH="$shim_dir:$PATH" command -v cargo

      # My build never installs a release: releases don't read my catalog (format 11, the backup chain), and the app's
      # update prompt could install one over this build. The patches live on this repo's main (the source checkout above
      # is `ref`, which doesn't have them); the step fails when they don't apply, so nothing builds without them.
      - name: Check out the no-update patches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: personal-build-main
          sparse-checkout: patches
          persist-credentials: false
      - name: No update installs (patch)
        run: |
          set -euo pipefail
          bash personal-build-main/patches/personal-no-update/apply.sh
          echo "- no update installs: startup check forced off, the update prompt only links to the release page" >> "$GITHUB_STEP_SUMMARY"

      # storytold's own packaging (heif on, fonts required), ad-hoc signed because MACOS_SIGN_IDENTITY is unset.
      # It also writes a DMG and a CLI zip to dist/release; only the app is uploaded.
      - name: Build LightCraft.app
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/macos/package.sh --arch aarch64

      # Only my build (ref integration with save-cache) writes the downloads cache; candidates only restore it.
      - name: Save Cargo's downloads
        if: inputs.cache == 'mbx' && inputs.save-cache && inputs.ref == 'integration' && steps.downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-downloads-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # The app zip must carry the license texts the project's own packaging puts there (packaging/env.sh copy_docs: the
      # project's licenses, Inter's OFL, one OFL per craft-fonts family). A missing one fails the run, never ships a build.
      - name: Check the license texts in the app
        id: licenses
        run: |
          set -euo pipefail
          dir=target/macos-package/LightCraft.app/Contents/Resources/Licenses
          for f in LICENSE-MIT LICENSE-APACHE NOTICE OFL-Inter.txt; do
            [ -s "$dir/$f" ] || { echo "::error::$f is missing from $dir"; exit 1; }
          done
          # By name, per family. (macOS' file system ignores case: craft-fonts' family `inter` and the project's own
          # OFL-Inter.txt are one file there, so packaging's copy of the one over the other leaves 29 files, not 30; the two texts
          # are identical. The count below is of names ignoring case.)
          missing=""
          for l in craft-fonts/fonts/*/OFL.txt; do
            fam=$(basename "$(dirname "$l")")
            [ -s "$dir/OFL-$fam.txt" ] || missing="$missing $fam"
          done
          [ -z "$missing" ] || { echo "::error::no OFL text in the app for the craft-fonts families:$missing"; exit 1; }
          want=$({ echo inter; for l in craft-fonts/fonts/*/OFL.txt; do basename "$(dirname "$l")" | tr '[:upper:]' '[:lower:]'; done; } | sort -u | wc -l | tr -d ' ')
          have=$(ls "$dir"/OFL-*.txt | wc -l | tr -d ' ')
          [ "$want" -gt 1 ] && [ "$have" -eq "$want" ] || { echo "::error::$have OFL files in the app, expected $want (Inter and each craft-fonts family, names ignoring case)"; exit 1; }
          echo "count=$have" >> "$GITHUB_OUTPUT"
          echo "- license texts in the app: LICENSE-MIT, LICENSE-APACHE, NOTICE and $have OFL files" >> "$GITHUB_STEP_SUMMARY"

      # upload-artifact drops the executable bit, so the bundle goes in as a ditto zip.
      - name: Zip LightCraft.app
        env:
          REF: ${{ inputs.ref }}
          SHORT: ${{ steps.build.outputs.short }}
          SHA: ${{ steps.build.outputs.sha }}
          FONTS: ${{ inputs.craft-fonts-ref }}
          RUSTC: ${{ inputs.rust-toolchain }}
        run: |
          set -euo pipefail
          mkdir -p out
          ditto -c -k --keepParent target/macos-package/LightCraft.app "out/LightCraft-$REF-$SHORT-macos-arm64.zip"
          {
            echo "### LightCraft.app: $REF at $SHORT"
            echo ""
            echo "- source: \`$SHA\`"
            echo "- craft-fonts \`$FONTS\`, rustc $RUSTC"
            echo "- install: \`just personal-download\` (my build) or \`just personal-download <scratch dir> $REF\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LightCraft-${{ inputs.ref }}-${{ steps.build.outputs.short }}-macos-arm64
          path: out/*.zip
          if-no-files-found: error
          retention-days: 30

  # My build only (ref `integration`): keep the app as a prerelease `build-<UTC yyyymmdd-hhmmss>-<short sha>` so going back to a
  # recent build is a download (`just personal-kept`), and delete all but the newest 4 `build-*` releases with their tags, here
  # in the workflow, so retention needs no laptop. Candidates publish nothing. A proof run (`proof-release`) publishes
  # `build-proof-…` instead, which retention never touches: delete it by hand. The release carries the app zip and, as loose
  # assets, the same license texts that are inside it; the job fails before it publishes anything when one is missing. This job
  # alone gets a write token, and only to create and delete releases; every other job reads.
  keep:
    name: Keep this build as a release
    if: inputs.ref == 'integration'
    needs: app
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: LightCraft-integration-${{ needs.app.outputs.short }}-macos-arm64
          path: out
      - name: Check the license texts (before anything is published)
        env:
          WANT: ${{ needs.app.outputs.licenses }}
        run: |
          set -euo pipefail
          [[ $WANT =~ ^[0-9]+$ ]] || { echo "::error::the app job named no license count"; exit 1; }
          zip=$(ls out/*.zip)
          mkdir -p unzipped licenses
          unzip -q "$zip" 'LightCraft.app/Contents/Resources/Licenses/*' -d unzipped
          dir=unzipped/LightCraft.app/Contents/Resources/Licenses
          for f in LICENSE-MIT LICENSE-APACHE NOTICE OFL-Inter.txt; do
            [ -s "$dir/$f" ] || { echo "::error::$f is missing from the app zip"; exit 1; }
          done
          have=$(ls "$dir"/OFL-*.txt | wc -l | tr -d ' ')
          [ "$have" -eq "$WANT" ] || { echo "::error::$have OFL texts in the app zip, the app job counted $WANT"; exit 1; }
          cp "$dir"/LICENSE-MIT "$dir"/LICENSE-APACHE "$dir"/NOTICE "$dir"/OFL-*.txt licenses/
          echo "license texts to attach: $(ls licenses | wc -l)"
      - name: Publish the release and keep the newest 4
        env:
          SHA: ${{ needs.app.outputs.sha }}
          SHORT: ${{ needs.app.outputs.short }}
          FORMAT: ${{ needs.app.outputs.format }}
          FONTS: ${{ inputs.craft-fonts-ref }}
          RUSTC: ${{ inputs.rust-toolchain }}
          PROOF: ${{ inputs.proof-release }}
        run: |
          set -euo pipefail
          [[ $SHA =~ ^[0-9a-f]{40}$ && $FORMAT =~ ^[0-9]+$ ]] || { echo "::error::the app job named no sha or catalog format"; exit 1; }
          stamp="$(date -u +%Y%m%d-%H%M%S)-$SHORT"
          if [ "$PROOF" = true ]; then tag="build-proof-$stamp"; else tag="build-$stamp"; fi
          zip=$(ls out/*.zip)
          cat > notes.md <<NOTES
          Personal build of nledford's integration branch: unreleased, ad-hoc signed, not for others.
          $([ "$PROOF" = true ] && echo "THROWAWAY PROOF RELEASE of the release job: it is deleted right after it is checked.")

          - source: \`$SHA\` (branch \`integration\` of this repository)
          - catalog format: $FORMAT
          - rustc $RUSTC, craft-fonts \`$FONTS\`
          - no update installs (patches/personal-no-update), so this build never replaces itself with a release
          - license texts (LICENSE-MIT, LICENSE-APACHE, NOTICE, OFL-*.txt for the embedded fonts) are inside the app (Contents/Resources/Licenses) and attached here as loose files
          - install: \`just personal-kept $tag <scratch dir>\` from the lightcraft tools
          NOTES
          gh release create "$tag" "$zip" licenses/* --prerelease --target "$SHA" --title "$tag" --notes-file notes.md
          echo "- kept as release \`$tag\` (catalog format $FORMAT)" >> "$GITHUB_STEP_SUMMARY"
          # newest 4 by tag name (the stamp sorts), older ones with their tags; proof releases never match
          gh release list --limit 100 --json tagName --jq '.[].tagName' | { grep -E '^build-[0-9]{8}-[0-9]{6}-[0-9a-f]+$' || true; } | sort -r | tail -n +5 |
            while read -r old; do
              echo "deleting $old"
              gh release delete "$old" --cleanup-tag --yes
            done

  # The steps of `cargo xtask ci`, in four groups on separate runners (linux-ci.yml; each group runs every one of its steps
  # even after a failure). Advisory: it doesn't hold the app back, and Linux builds no macOS-only code.
  linux:
    name: Linux ${{ matrix.group }}
    if: inputs.linux-ci
    strategy:
      fail-fast: false
      matrix:
        group: [lint, test, heif-doc, wasm]
    uses: ./.github/workflows/linux-ci.yml
    with:
      ref: ${{ inputs.ref }}
      craft-fonts-ref: ${{ inputs.craft-fonts-ref }}
      rust-toolchain: ${{ inputs.rust-toolchain }}
      group: ${{ matrix.group }}
      save-cache: ${{ inputs.save-cache && inputs.ref == 'integration' }}
      cache: ${{ inputs.linux-cache }}

  # One place for the Linux result: every failed step and test of the four groups, and each group's times. Its conclusion is
  # what `just personal-download` reads (the job name is how it finds it).
  linux-summary:
    name: xtask ci steps (Linux)
    if: always() && inputs.linux-ci
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: xtask-result-*
          path: results
          merge-multiple: true
        continue-on-error: true
      - name: Every failed step and test
        env:
          REF: ${{ inputs.ref }}
          LINUX: ${{ needs.linux.result }}
        run: |
          bash scripts/xtask-summary.sh "xtask ci steps (Linux): $REF" "$LINUX" results
