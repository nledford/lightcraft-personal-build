# Builds one source branch of this repo: `integration` (my build of storytold/lightcraft with my open PRs) or a
# `candidate-<name>` (an integration rebuild to compare against it). Started by `just personal-build` from the lightcraft
# tools (lightcraft-local), which pushes the branch here and dispatches this workflow on `main` with the branch as `ref`.
# Every run belongs to `main`, so all of them share `main`'s caches; only runs with save-cache (my build) write them.
name: Build
run-name: ${{ inputs.ref }} (${{ inputs.save-cache && 'my build' || 'candidate' }})

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source branch of this repo: integration or candidate-<name>"
        required: true
        type: string
      craft-fonts-ref:
        description: "storytold/craft-fonts commit (the laptop's craft-fonts-current)"
        required: true
        type: string
      rust-toolchain:
        description: "rustc version (the laptop's), e.g. 1.99.1"
        required: true
        type: string
      save-cache:
        description: "Write the dependency caches (my build only; candidates read them)"
        required: false
        type: boolean
        default: false
      linux-ci:
        description: "Also run every cargo xtask ci step on Linux"
        required: false
        type: boolean
        default: true
      cache:
        # Measured 29 Oct at 4f216e6b58 (app job): cold 13.2 min mbx vs 16.8 rust-cache; same commit restored 2.3 vs 7.5;
        # a one-line edit in lightcraft-develop 6.1 vs 6.6. rust-cache stays as a fallback if the mbx Action breaks.
        description: "App job compile cache: mbx (per-compilation objects, our own crates too) or rust-cache (dependencies only)"
        required: false
        type: choice
        options: [mbx, rust-cache]
        default: mbx

permissions:
  contents: read

# One run per source branch: a newer dispatch for the same branch replaces its run; branches run side by side.
concurrency:
  group: build-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: LightCraft.app (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Name the build
        id: build
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          case $REF in integration | candidate-?*) ;; *) echo "::error::ref must be integration or candidate-<name>, not '$REF'"; exit 1 ;; esac
          case $REF in */*) echo "::error::ref '$REF' has a '/'"; exit 1 ;; esac
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:10}" >> "$GITHUB_OUTPUT"
          echo "LIGHTCRAFT_BUILD_SHA=$sha" >> "$GITHUB_ENV"

      # My library is catalog format 11 (the backup chain, #800/#814 and up); main writes 9 and refuses it. A build
      # without format 11 must never reach my library, so fail before building it.
      - name: Require catalog format 11
        run: |
          set -euo pipefail
          if ! grep -Eq '^[[:space:]]*format\(11,' crates/catalog/src/journal.rs; then
            echo "::error::crates/catalog/src/journal.rs has no catalog format 11: this build lacks the backup chain (#800/#814) and must not open my library."
            exit 1
          fi

      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ inputs.craft-fonts-ref }}
          path: craft-fonts
          persist-credentials: false

      # Does nothing unless the source has craft-i18n.rev (as in storytold's release workflow).
      - name: Check out craft-i18n
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          targets: aarch64-apple-darwin

      # rust-cache keys on the toolchain and Cargo.lock and falls back to the newest entry with the same prefix, so a
      # candidate restores my build's dependencies and rebuilds only what changed. The root Cargo.toml (profiles,
      # workspace dependencies) is not in the key, unlike storytold's gate.yml, so candidates keep that fallback; a change
      # there with an unchanged Cargo.lock rebuilds those dependencies until Cargo.lock next changes (slower, never wrong).
      - if: inputs.cache == 'rust-cache'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          key: app-macos-aarch64
          save-if: ${{ inputs.save-cache }}
          cache-on-failure: true

      # mbx (mr boxington) keys each compiler call by its inputs, so our own unchanged crates are reused too, not only
      # dependencies. `objects` mode because a fresh checkout's new file times would make Cargo rebuild a restored target/.
      # Objects leave out Cargo's downloads, so those get their own cache.
      - if: inputs.cache == 'mbx'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-downloads-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-downloads-
      - if: inputs.cache == 'mbx'
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          github-cache-mode: objects
          save-on-workflow-dispatch: ${{ inputs.save-cache }}
      # package.sh runs plain `cargo build`: put mbx's Cargo shim first on PATH so those builds go through mbx.
      - if: inputs.cache == 'mbx'
        name: Route cargo through mbx
        run: |
          set -euo pipefail
          mbx --version
          mbx setup --status || true
          mbx setup </dev/null
          shim_dir="$HOME/Library/Application Support/mbx/bin"
          [ -x "$shim_dir/cargo" ] || { echo "::error::no Cargo shim at $shim_dir"; exit 1; }
          echo "$shim_dir" >> "$GITHUB_PATH"
          PATH="$shim_dir:$PATH" command -v cargo

      # My build never installs a release: releases don't read my catalog (format 11, the backup chain), and the app's
      # update prompt could install one over this build. The patches live on this repo's main (the source checkout above
      # is `ref`, which doesn't have them); the step fails when they don't apply, so nothing builds without them.
      - name: Check out the no-update patches
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: personal-build-main
          sparse-checkout: patches
          persist-credentials: false
      - name: No update installs (patch)
        run: |
          set -euo pipefail
          bash personal-build-main/patches/personal-no-update/apply.sh
          echo "- no update installs: startup check forced off, the update prompt only links to the release page" >> "$GITHUB_STEP_SUMMARY"

      # storytold's own packaging (heif on, fonts required), ad-hoc signed because MACOS_SIGN_IDENTITY is unset.
      # It also writes a DMG and a CLI zip to dist/release; only the app is uploaded.
      - name: Build LightCraft.app
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/macos/package.sh --arch aarch64

      # upload-artifact drops the executable bit, so the bundle goes in as a ditto zip.
      - name: Zip LightCraft.app
        env:
          REF: ${{ inputs.ref }}
          SHORT: ${{ steps.build.outputs.short }}
          SHA: ${{ steps.build.outputs.sha }}
          FONTS: ${{ inputs.craft-fonts-ref }}
          RUSTC: ${{ inputs.rust-toolchain }}
        run: |
          set -euo pipefail
          mkdir -p out
          ditto -c -k --keepParent target/macos-package/LightCraft.app "out/LightCraft-$REF-$SHORT-macos-arm64.zip"
          {
            echo "### LightCraft.app: $REF at $SHORT"
            echo ""
            echo "- source: \`$SHA\`"
            echo "- craft-fonts \`$FONTS\`, rustc $RUSTC"
            echo "- install: \`just personal-download\` (my build) or \`just personal-download <scratch dir> $REF\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LightCraft-${{ inputs.ref }}-${{ steps.build.outputs.short }}-macos-arm64
          path: out/*.zip
          if-no-files-found: error
          retention-days: 30

  # The steps of `cargo xtask ci` (as in xtask/src/main.rs cmd_ci on 29 Oct), each run even after an earlier one failed,
  # as `just ci-rest` does locally; `xtask ci` itself stops at the first failure. Setup follows storytold's gate.yml
  # (craft-common-actions), which can't be called here because it checks out the dispatching ref, not `ref`.
  # Advisory: it doesn't hold the app back, and Linux builds no macOS-only code.
  linux:
    name: xtask ci steps (Linux)
    if: inputs.linux-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      RUST_BACKTRACE: 1
      # xtask ci caps test threads at 4 (frame-budget tests get flaky with more); the runner has 4 CPUs anyway.
      RUST_TEST_THREADS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ inputs.craft-fonts-ref }}
          path: craft-fonts
          persist-credentials: false

      - name: Build with craft-fonts
        run: |
          echo "CRAFT_FONTS_DIR=$GITHUB_WORKSPACE/craft-fonts" >> "$GITHUB_ENV"
          echo "CRAFT_FONTS_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Check out craft-i18n
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main

      # Nothing waits on it: the space is free before the build needs it.
      - name: Free disk space
        run: |
          nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL </dev/null >/dev/null 2>&1 &

      - name: Install Linux build dependencies
        uses: storytold/craft-common-actions/actions/install-apt-packages@main
        with:
          # The action saves only on pushes to the default branch by default; every run here is a dispatch.
          save: ${{ inputs.save-cache && 'always' || 'never' }}
          packages: >-
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
            libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
            libgl1-mesa-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ inputs.rust-toolchain }}
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          key: linux-ci
          save-if: ${{ inputs.save-cache }}
          cache-on-failure: true

      - name: Every xtask ci step
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -uo pipefail
          export LIGHTCRAFT_CONFIG_DIR="$RUNNER_TEMP/lightcraft-test-config"
          mkdir -p "$LIGHTCRAFT_CONFIG_DIR"
          log="$RUNNER_TEMP/steps.log"
          failed=""
          step() {
            local name=$1
            shift
            echo "::group::$name"
            if "$@" 2>&1 | tee -a "$log"; then r=ok; else r=FAIL; failed="$failed $name"; fi
            echo "::endgroup::"
            echo "$r $name"
          }
          step type cargo xtask type
          step fmt cargo fmt --all -- --check
          step clippy cargo clippy --workspace --all-targets --keep-going -- -D warnings
          step heif cargo clippy -p lightcraft-codecs --features heif --all-targets -- -D warnings
          step heif-test cargo test -p lightcraft-codecs -p lightcraft-heif --features lightcraft-codecs/heif --lib --bins --tests --no-fail-fast
          step heif-engine cargo test -p lightcraft-engine --lib --features lightcraft-codecs/heif --no-fail-fast heic
          step test cargo test --workspace --lib --bins --tests --no-fail-fast
          step doctest cargo test --workspace --doc --no-fail-fast
          for s in parity layers refusals assets wasm; do step "$s" cargo xtask "$s"; done
          {
            echo "### xtask ci steps (Linux): $REF"
            echo ""
            echo "Failed steps:${failed:- none}"
            echo ""
            # shellcheck disable=SC2016 # the backticks are Markdown, not a command
            sed -nE 's/^test (.*) \.\.\. FAILED$/- `\1`/p' "$log" | sort -u
          } >> "$GITHUB_STEP_SUMMARY"
          [ -z "$failed" ]
